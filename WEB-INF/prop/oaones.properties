# OAones：OA-E9 与多企业微信租户组织人员双向同步
# 业务表都建在 E9 建模引擎的 uf_ 命名空间下；这里**只登记表名**，不再登记建模模块ID：
# 需要模块ID的地方（写入数据行 formmodeid、按建模共享规则重构单条数据权限）由程序按
# “workflow_bill.tablename → workflow_bill.id → modeinfo.id”反查（WeaverUtil，结果按表名缓存）；
# 表不是建模表时反查结果为 0，这两件事自动跳过，不影响绑定/同步/登录本身的读写。
# 也就是说：建模引擎里改了表名（模块ID不变）本模块自动跟随；
# 换了物理表（不是建模表）也只改这里的表名一处，不用再去核对模块ID。
oaones_qywx_config_table=uf_oaones_qywx_config
oaones_dept_bind_table=uf_oaones_dept_bind
oaones_sub_tenant_map_table=uf_oaones_sub_tenant_map
oaones_user_bind_table=uf_oaones_user_bind
oaones_sync_log_table=uf_oaones_sync_log
# 同步日志明细（uf_oaones_sync_log_item）：一行一个同步对象（单条部门 / 单条人员），
# 记录该对象本次同步的动作（新增/更新/跳过/失败）、两侧对象与过程说明，
# 页面“同步日志 → 明细”按它逐条展示；历史日志没有明细行时退回展示日志的 detail 文本。
oaones_sync_log_item_table=uf_oaones_sync_log_item
# 同步中心“同步设置”（uf_oaones_sync_plan）：一行 = 平台 + 租户 + 同步方向，
# 存该方向的计划任务（cron 表达式 + 启停）与“成员没有找到部门”时的处理口径
# （OA→平台：不同步 / 直接挂在租户下；平台→OA：指定默认 OA 部门）。
# 计划任务类：com.customization.oaones.appsyn.job.OaonesSyncPlanCronJob（建议每分钟执行一次）。
oaones_sync_plan_table=uf_oaones_sync_plan
# 同步中心“计划任务”的执行方式：默认由**模块内置调度器**按页面配置的 cron 执行，
# **不需要**在 E9 后台“计划任务”里配置任何类（也不需要写 schedulesetting 表）。
#   sync.plan.enable       1 = 启用内置调度器（默认）/ 0 = 关闭（改回用 E9 后台计划任务类
#                          com.customization.oaones.appsyn.job.OaonesSyncPlanCronJob）
#   sync.plan.tick.seconds 扫描间隔（秒，默认 30，最小 10）：每次扫描把 next_run_time 已到点的设置挑出来执行
#   sync.plan.batch        一次扫描最多执行多少条设置（默认 20）
# 调度器随第一个访问 OAones 页面/接口的请求自动启动（幂等，只起一个守护线程）；
# 想让它在 E9 启动时就跑起来（不依赖有人访问），可在 WEB-INF/web.xml 里追加一个监听器：
#   <listener><listener-class>com.customization.oaones.appsyn.job.OaonesSyncPlanSchedulerListener</listener-class></listener>
sync.plan.enable=1
sync.plan.tick.seconds=30
sync.plan.batch=20
oaones_dep_tmp_table=uf_oaones_dep_tmp
oaones_user_rule_table=uf_oaones_user_rule
oaones_user_tmp_table=uf_oaones_user_tmp
oaones_app_bind_table=uf_oaones_app_bind
# ===== 应用中心（/oaones/appCenter/AppList.jsp + /oaones/appCenter/Desktop.jsp）=====
# 一行一个第三方应用：应用名称 + 默认访问地址 + 单点登录实现类。
#   app_url   应用默认访问地址（没有配单点登录实现类时直接打开它）；
#   sso_class 单点登录实现类全限定名，必须实现 com.customization.oaones.appsyn.appsso.AppSsoHandler
#             （该类里的 loginUrl(AppSsoContext) 就是“对方身份认证”的实现；留空 = 不做单点登录）；
#   sso_method 身份认证方法说明（选填，纯展示，例如方法签名）。
# 与“应用绑定”表（oaones_app_bind_table）是两张不同的表：那张是“企微工作台应用 → OA 页面”的免登录绑定，
# 本表是**没有租户维度**的应用清单（桌面启动台的图标来源）。
oaones_app_table=uf_oaones_app
# 「应用中心」的维护人：除系统管理员（user.id=1）外，只有这里列出的人员（逗号分隔的 OA 人员ID）
# 能查看/修改应用列表；留空表示仅系统管理员可维护（桌面启动台对本模块任何登录人只读可用）。
appc.admin.ids=1462

# ===== 全局超级管理员：一个「角色」内的全部人员拥有 OAones 全部管理权限 =====
# total.admin.roleid：填**一个** E9 角色ID（组织权限中心 → 角色管理里维护的角色，表 HrmRoles）。
# 该角色内的人员与系统管理员（user.id=1）**权限完全一致**：OAones 所有页面 / 所有租户
# （含未指定维护人的租户）、所有维护动作（新增 / 修改 / 删除 / 同步 / 清理）都放行，
# 等价于把下列“除系统管理员外还要单独登记的人员ID”一次性全部授权：
#   appc.admin.ids / login.admin.ids / msg.admin.ids / pw.admin.ids /
#   apilog.admin.ids / opmonitor.admin.ids
# （这些 *admin.ids 名单仍然有效，两种方式并存，谁都不用改）
#
# 角色成员按 E9 角色自身的口径判定（不重新实现）：
#   ① 角色里按「人员」添加的成员；
#   ② 角色里按「分部」添加的成员——登录人所在分部命中，且登录人的 OA 安全级别在该成员行的
#      安全级别区间内（seclevelfrom ~ seclevelto）；
#   ③ 角色里按「部门」添加的成员——登录人所在部门命中，且安全级别同样落在区间内；
#   ④ 角色里按「岗位」添加的成员（含岗位的适用分部 / 部门范围）。
# 判定由平台标准能力完成：com.engine.common.service.HrmCommonService#getHrmRoleMembers_queryConditionSql
# （与平台自带的角色/共享判定同一口径，见 com.engine.hrm.util.HrmRoleMemberUtil）。
#
# 留空或填 0 = 不启用（此时只有 user.id=1 拥有全部权限，与改造前完全一致）。
# 注意：只填**角色ID**（HrmRoles.id，整数），不是人员ID、也不是角色标识 rolesmark；
#       改完最多 1 分钟生效（程序对判定结果做了 60 秒缓存），不用重启 E9。
total.admin.roleid=

# ===== OA 分权（选择 OA 组织架构的候选跟 OA 自身的分权联动）=====
# 页面里“选择 OA 分部 / OA 部门 / OA 人员”的候选，在 **OA 开了分权** 时按登录人的
# 分权范围过滤（只能看到自己范围内的组织与成员），口径与平台自己的组织 / 人员选择框完全一致。
# E9 的两套分权都支持，程序按 OA 实际启用的那套走（应用分权优先，与平台的判断顺序一致）：
#   ① 应用分权（E9 后台「分权管理 → 应用分权」，SystemSet.appdetachable=1）：
#      用平台的 weaver.hrm.appdetach.AppDetachComInfo 判定每个候选分部 / 部门 / 人员；
#      不在任何“应用分权”范围内的账号按平台口径就是“可看全部”；
#   ② 管理分权 / 角色分权（SystemSet.detachable=1 或该权限点自身开了分权）：
#      用 CheckSubCompanyRight 的部门级 / 分部级范围判定。
# **两套都没开时不过滤**（保持模块原有“全量候选”的行为）。
#
# 下面四项只影响“管理分权 / 角色分权”那一套（应用分权不需要额外配置）：
#   oa.sec.right.sub   分部候选用的 E9 分权权限点（默认 Subcompanys:decentralization）
#   oa.sec.right.dept  部门候选用的 E9 分权权限点（默认 Departments:decentralization）
#   oa.sec.right.user  人员候选用的 E9 分权权限点（默认 Resources:decentralization）
#   oa.sec.force       1=强制按分权过滤 / 0=强制不过滤 / 留空或其它=跟随 OA 系统设置
#
# 受影响的只有“选择候选”（user.oaUsers / user.orgOptions / dept.list / sub.list /
# sync.orgOptions / pw.orgOptions）；绑定关系列表、同步日志、绑定总览等结果视图
# 与后台同步（企微 ←→ OA，由内置调度器执行）不按 OA 分权过滤。
oa.sec.right.sub=Subcompanys:decentralization
oa.sec.right.dept=Departments:decentralization
oa.sec.right.user=Resources:decentralization
oa.sec.force=

# ===== URL 路由（对外地址 ←→ 实际页面；隐藏真实 .jsp 地址）=====
# 给页面配一个固定的**对外地址**：浏览器上只出现对外地址，真实 .jsp 地址不允许被直接访问。
# 本模块**全部配置都在这一个文件**里，路由也写在下面（key 以 route. 开头，只认这个前缀）：
#
#   route.<对外地址>=<实际页面>[|forward|redirect][|hide|hide404]
#
#   forward   （默认）服务端内部转发：地址栏保持对外地址，查询串（gopage / t 等）照常透传；
#   redirect  302 跳到实际页面：地址栏会变成实际页面（一般不用，除非页面必须按真实地址运行）；
#   hide      直接访问“实际页面”时 302 回对外地址（推荐：员工、书签、菜单里只会看到对外地址）；
#   hide404   直接访问“实际页面”时返回 404（比 hide 更严格：老地址彻底不可用，
#             用之前请先把 E9 后台菜单 / 门户 / 已经发给员工的地址都改成对外地址）。
#
# 说明：
#   * 只对下面**明确写出来**的地址生效：其它 URL（平台页面、接口、静态资源）一律不碰；
#   * 改完立即生效（程序按本文件修改时间热加载、最多 1 秒），不用重启 E9，也不用改 web.xml；
#   * 过滤器注册在 WEB-INF/resin-web-post.xml（本定制新增的文件，不是平台出厂文件）；
#   * 对外地址不要与真实存在的页面重名；实际页面必须是站内以 / 开头的路径；
#   * 企业微信 / 钉钉 / 飞书后台登记的回调地址（login.scan.path、appEntry.path 等）
#     **不在路由范围**，仍然是 /oaones/login/scan.jsp、/oaones/appBind/*/appEntry.jsp，不用改平台后台。
#
# 默认两条：统一登录页、桌面启动台（登录成功后的落地页按这里的对外地址输出，见 login/login.jsp）。
route./oaones/login=/oaones/login/login.jsp|forward|hide
route./oaones/desktop=/oaones/appCenter/Desktop.jsp|forward|hide

# 扫码登录票据（uf_oaones_scan_login）：登录页自己生成的二维码 + 扫码命中结果 + 一次性登录令牌
oaones_scan_login_table=uf_oaones_scan_login
# 统一登录设置（uf_oaones_login_config）：登录方式开关（账号密码/手机号/企业微信扫码/钉钉/个人微信）+ 二维码有效期
oaones_login_config_table=uf_oaones_login_config
# 登录验证码（uf_oaones_login_sms）：验证登录（手机号 / 邮箱）的验证码记录（本模块自管，不沿用任何历史验证码表）
oaones_login_sms_table=uf_oaones_login_sms
# 个人微信授权密钥（uf_oaones_personal_wx_config）：微信 AppID / AppSecret，本表只保留一行
oaones_personal_wx_config_table=uf_oaones_personal_wx_config
# 个人微信绑定（uf_oaones_personal_wx_bind）：一个 OA 人员最多一行（本人自助 / 管理员代绑）
oaones_personal_wx_bind_table=uf_oaones_personal_wx_bind
# 企业微信接口网关
wx.api.base=https://qyapi.weixin.qq.com

# ===== 钉钉连接器（DingTalk）=====
# 与企微连接器并行的一套入口：钉钉页面在 /oaones/**/DingTalk/ 下，
# 后端在 com.customization.oaones.appsyn.**.dingtalk 包下，
# 业务表**与企微共用同一批**（设置类表结构可复用时不新建表），
# 用 uf_oaones_qywx_config.type 区分租户平台（0 企微 / 1 钉钉）。
#
# 钉钉服务端接口网关（gettoken / topapi 等老接口）
dd.api.base=https://oapi.dingtalk.com
# 钉钉新版开放接口网关（OAuth2 用户令牌、contact/users/me）
dd.open.api.base=https://api.dingtalk.com
# 钉钉扫码登录/网页授权网关与授权页路径（自建应用“获取登录用户的访问凭证”第一步）
dd.login.base=https://login.dingtalk.com
dd.login.auth.path=/oauth2/auth
# 扫码授权申请的 scope（钉钉固定 openid）
dd.login.scope=openid
# 钉钉扫码的落地页路径：只用于**钉钉网页授权回跳**（redirect_uri）。
# 二维码内容统一指向 login.scan.path（/oaones/login/scan.jsp），本路径上的页面只做 302 跳到那里，
# 这样钉钉后台已登记的“回调域名/重定向地址”不用改（该域名下路径不变即可）。
dd.login.scan.path=/oaones/login/DingTalk/scan.jsp
# 钉钉扫码登录优先探测的租户配置ID：单租户部署建议填上（一次跳转即命中）；留空按可用租户顺序探测
dd.login.cfg_id=
# 钉钉工作台应用免登录入口的地址前缀（协议+域名+端口，不含路径）；留空按浏览器访问地址自动拼。
# 该地址要填进钉钉后台“应用主页”，钉钉会在后面追加 code（免登授权码）。
dd.app.entry.base=
# 免登录入口页路径（默认即可；改目录时同步修改这里与 E9 菜单地址）
dd.app.entry.path=/oaones/appBind/DingTalk/appEntry.jsp
# 钉钉个人账号中心扫码绑定回调地址前缀（协议+域名+端口，不含路径）；
# 必须是钉钉后台应用“重定向URL/可信域名”里的地址，留空按浏览器访问地址自动拼
dd.account.callback.base=

# ===== 飞书连接器（Feishu / 海外版 Lark）=====
# 与企微、钉钉并行的第三套入口：飞书页面在 /oaones/**/Feishu/ 下，
# 后端在 com.customization.oaones.appsyn.**.feishu 包下，
# 业务表**与企微、钉钉共用同一批**（设置类表结构可复用时不新建表），
# 用 uf_oaones_qywx_config.type 区分租户平台（0 企微 / 1 钉钉 / 2 飞书）。
#
# 飞书开放平台只有一个网关（通讯录 / 网页授权 / 消息 / 任务都在它下面），
# 海外版 Lark 换成 https://open.larksuite.com 即可，不用改 Java。
fs.api.base=https://open.feishu.cn
# 飞书网页授权（扫码登录 / 工作台免登 / 扫码绑定）网关与授权页路径；
# 自建应用的“重定向URL”要在飞书开放平台登记成下面的落地页/回调页地址
fs.login.base=https://open.feishu.cn
fs.login.auth.path=/open-apis/authen/v1/authorize
# 飞书扫码的落地页路径：只用于**飞书网页授权回跳**（redirect_uri，飞书要求精确匹配）。
# 二维码内容统一指向 login.scan.path（/oaones/login/scan.jsp），本路径上的页面只做 302 跳到那里，
# 因此飞书开放平台“安全设置-重定向URL”里已登记的旧地址不用改；
# 新部署也可以直接把重定向 URL 登记成 /oaones/login/scan.jsp 并把本项改成同一个值。
fs.login.scan.path=/oaones/login/scan.jsp
# 飞书扫码登录优先探测的租户配置ID：单租户部署建议填上（一次跳转即命中）；留空按可用租户顺序探测
fs.login.cfg_id=
# 飞书工作台（网页应用）免登录入口的地址前缀（协议+域名+端口，不含路径）；留空按浏览器访问地址自动拼。
# 该地址要填进飞书开放平台该应用的“网页应用主页”，客户端打开时由本模块跳一次飞书网页授权换身份
fs.app.entry.base=
# 免登录入口页路径（默认即可；改目录时同步修改这里与 E9 菜单地址）
fs.app.entry.path=/oaones/appBind/Feishu/appEntry.jsp
# 飞书个人账号中心扫码绑定回调地址前缀（协议+域名+端口，不含路径）；
# 必须是飞书开放平台“重定向URL”里登记过的地址，留空按浏览器访问地址自动拼
fs.account.callback.base=
# 飞书「待办」挂靠的任务清单GUID（可选）：配了就把待办同时挂到该清单下，未配只建任务
fs.task.tasklist.guid=
# 企业微信扫码授权（网页授权登录）网关：个人账号中心内嵌二维码所在域名
wx.qr.base=https://open.work.weixin.qq.com
# 扫码授权页面路径（默认自建应用经典扫码登录地址）；改用 login.work.weixin.qq.com 时
# 填 /wwlogin/sso/login 并把 wx.qr.extra_params 配成 login_type=CorpApp
wx.qr.path=/wwopen/sso/qrConnect
# 扫码授权地址的附加查询串（原样追加在 appid/agentid/redirect_uri/state 之后，请自行保证已编码），默认留空
wx.qr.extra_params=
# 个人账号中心扫码绑定回调地址前缀（协议+域名+端口，不含路径）；留空按浏览器当前访问域名自动拼接。
# 反向代理/多域名部署时必须填写企业微信后台“可信域名”对应的地址，否则企业微信会以 redirect_uri 不匹配拒绝授权。
account.callback.base=
# 个人账号中心扫码 state 令牌有效期（毫秒），默认 15 分钟
account.qr.state.ttl=900000
# 企微工作台应用免登录入口的地址前缀（协议+域名+端口，不含路径），一般不需要配：
# 留空时自动按“系统设置里的 OA 访问地址（后台微信设置 → OA访问地址，表 wechat_Set.oaUrl，
# 与 E9 给企业微信推送消息用的是同一个地址）→ X-Forwarded-Proto/X-Forwarded-Host 代理头
# → 浏览器当前访问地址”依次取值；企业微信要求 https，系统设置里请填 https 地址。
# 只有“免登录入口要走另一个域名”这类特殊场景才在这里显式覆盖。
app.entry.base=
# 免登录入口页路径（默认即可；改目录时同步修改这里与 E9 菜单地址）
app.entry.path=/oaones/appBind/WeCom/appEntry.jsp
# 企业微信网页授权（OAuth2）网关与授权页路径：入口页缺少 code 时跳转到这里换取授权码
# （应用主页未配置成企业微信自动带 code 时作为兜底；换网关只改这里，不改 Java）
app.oauth.base=https://open.weixin.qq.com
app.oauth.path=/connect/oauth2/authorize
http.timeout=30000

# ===== 统一登录页（/oaones/login/login.jsp）=====
# 账号密码登录本身走 E9 平台自己的登录接口（/api/hrm/login/getLoginForm、checkLogin），
# 密码策略、验证码、弱密码、二次认证由平台口径决定，本模块不重实现；
# 验证登录（手机号 / 邮箱）的验证码由本模块自管（见下面“验证登录”一段）；
# 这里配“扫码登录”相关项。
#
# 登录页上的二维码是**本系统自己生成**的（不内嵌企业微信/钉钉/飞书托管的二维码页）：
#   二维码内容 = 站点地址 + login.scan.path + ?t=<票据>，票据存 uf_oaones_scan_login。
#   登录页上只有**一个扫码页签、一张二维码**：企业微信 / 钉钉 / 飞书客户端扫的都是它，
#   扫码方只是打开这个本站地址，由 OA 侧按扫码客户端的 User-Agent 判断平台、
#   再依次用它已对接的租户配置（企微/钉钉/飞书各自的租户表）换成员身份 ——
#   所以一张二维码既能服务多个租户（不是该企业成员就自动试下一家），也能被三个平台扫。
#   各平台是否允许扫码由“登录设置”里对应的开关决定（wecom/dingtalk/feishu_qr_enable）。
#
# 扫码登录优先探测的企微租户配置ID：单租户部署建议填上（一次跳转即命中，不用逐家探测）；
# 留空时按“启用中的可用租户”顺序逐家探测（多租户、一张二维码共用时用这种）。
login.qywx.cfg_id=
# 二维码有效期（毫秒），默认 2 分钟（120 秒）：**仅作为“登录设置”页二维码有效期留空时的默认值**，
# 设置页按秒维护（30~180 秒，最长 3 分钟）、优先于这里；超时后登录页提示“已超时，请手动刷新二维码”，
# 登录页按秒倒计时，点二维码图片或“刷新二维码”都会重新生成并重新计时
login.qr.ttl=120000
# PC 页面轮询间隔（毫秒），默认 1.5 秒
login.qr.poll.ms=1500
# 扫码后是否需要在手机上点“确认登录”：1=需要，0=扫码即登录（默认，直接进工作台）
login.qr.confirm=0
# 过期票据保留小时数（新建二维码时顺手清理更早的记录，不需要额外计划任务）
login.qr.keep.hours=24
# 扫码落地页路径（二维码内容里的本站地址；企业微信的网页授权回调地址也用这一项）。
# 不要用菜单权限/安全规则挡掉；钉钉/飞书的回调地址仍配各连接器自己的 dd.login.scan.path /
# fs.login.scan.path（那两个旧地址现在只做 302 跳到本页，平台侧配置不用改）。
login.scan.path=/oaones/login/scan.jsp
# 登录成功后的默认落地页（未指定 gopage 时用；`#` 之后的页面参数会整段保留）。
# 默认进工作台对外地址 /oaones/desktop（路由到桌面启动台），不再落到系统首页；
# 想回到系统首页把本项改回 /wui/index.html#/main 即可。
login.landing.url=/oaones/desktop
# Desktop landing: seconds before following gopage (0 = disable auto redirect)
login.landing.gopage.seconds=5
# 登录页标题（左侧品牌区与浏览器标题）
# 注意：本项是**值里带中文**的配置，本文件按 GBK 保存，值里直接写中文即可。
# 平台读 properties 用的是 ISO-8859-1（weaver.file.Prop#loadTemplateProp → Properties.load），
# 中文值会被读成一串 Latin-1 乱码，OaonesProps 会再按 GBK 还原回来（OaonesProps#decodePropValue），
# 所以本文件必须保存为 **GBK**（不要存成 UTF-8，那会让值里的中文读出乱码）。
login.page.title=OA 协同办公系统
# 统一登录设置的维护人：除系统管理员（user.id=1）外，只有这里列出的人员（逗号分隔的 OA 人员ID）
# 能查看/修改登录方式开关与二维码有效期；留空表示仅系统管理员可维护。
login.admin.ids=1462

# ===== 验证登录：手机号 / 邮箱（“统一登录设置”里开启对应验证方式后生效） =====
# 验证码由本模块自己管理（表 uf_oaones_login_sms：手机号写 mobile 列、邮箱写 email 列，
# 验证码都不存明文），两种验证方式共用下面这一套「有效 / 冷却 / 上限 / 位数」参数：
# 发送调用**平台标准能力**——手机号走 weaver.sms.SMSManager.sendSMS
# （后台“短信设置”里配置的通道，含自定义通道，并落平台“我的短信”）；
# 邮箱走 weaver.email.externalmail.send.EmailSend（发件账号取后台“邮件设置 → 群发邮件设置”
# 里的系统群发邮箱，与平台“邮件提醒”同一条通道）。
# 本模块不直连任何短信服务商 / 邮件服务器、也不引用其它定制包（如 com.customization.ghedu.*）。
# 验证码有效期（秒）
login.sms.ttl=300
# 同一手机号 / 邮箱两次发送的最小间隔（秒）
login.sms.cooldown=60
# 同一手机号 / 邮箱每天最多发送次数
login.sms.daily.max=10
# 同一验证码最多允许输错次数（超过即作废，需重新获取）
login.sms.max.wrong=5
# 验证码位数（4~8）
login.sms.length=6
# 过期验证码记录保留小时数（发送新验证码时顺手清理，不需要计划任务）
login.sms.keep.hours=24
# 短信正文模板：{code} 验证码、{minutes} 有效分钟数；平台会按后台短信设置自动加签名。
# 注意：这是**值里带中文**的配置，本文件按 GBK 保存，值里直接写中文（还原见 OaonesProps#decodePropValue）。
login.sms.template=您的登录验证码为 {code}，{minutes} 分钟内有效，请勿转发他人。
# 兜底短信服务类（可留空）：默认走平台标准能力 weaver.sms.SMSManager（后台“短信设置”的通道）。
# 如果本环境没有启用平台短信服务、但另有自定义通道在发短信，可在这里填**实现了平台接口
# weaver.sms.SmsService** 的类全限定名，本模块会反射调用它（只依赖平台接口，不引用其它定制包）。
# 例：login.sms.service.class=com.xxx.YourSmsService
login.sms.service.class=

# 登录验证码邮件的主题与正文模板（{code} 验证码、{minutes} 有效分钟数）。
# 与短信模板同一口径：值里带中文，本文件按 GBK 保存（还原见 OaonesProps#decodePropValue）。
login.email.subject=登录验证码
login.email.template=您的登录验证码为 {code}，{minutes} 分钟内有效，请勿转发他人。

# ===== 个人微信（与企微 / 钉钉 / 飞书并列的第四个平台，但没有“租户”概念）=====
# 页面：「微信设置」/oaones/personalWx/config.jsp（独立一级菜单，维护授权密钥 + 绑定列表）、
#       个人账号中心「个人微信」页签 /oaones/accountCenter/MyAccount.jsp?tab=personalwx（本人自助）、
#       扫码回调页 /oaones/personalWx/PersonalWxCallback.jsp（redirect_uri，无登录会话）。
# 表：uf_oaones_personal_wx_config（授权密钥，只保留一行）、
#     uf_oaones_personal_wx_bind（绑定，一个 OA 人员一行），表名见文件上方。
#
# 扫码流程：页面内嵌微信扫码授权二维码 → 用户用个人微信扫码确认 → 微信把浏览器重定向到回调页
# （带 code + state）→ 回调页用 state 校验发起人（OaonesScanToken，HMAC-SHA256 + AppSecret 签名）
# → 用 code 换 openid/unionid → 写绑定。一个微信号只能绑一个 OA 账号，重复扫码即换绑。
#
# 扫码授权网关（内嵌二维码页面所在域名，默认微信开放平台）
pw.oauth.base=https://open.weixin.qq.com
# 扫码授权页面路径：默认微信开放平台“网站应用”的扫码登录地址（scope=snsapi_login，可用个人微信扫码）；
# 换公众号网页授权等其它入口时改这里与 pw.oauth.scope 即可，不用改 Java
pw.oauth.path=/connect/qrconnect
# 扫码授权申请的 scope（微信开放平台网站应用是 snsapi_login）
pw.oauth.scope=snsapi_login
# 扫码授权地址的附加查询串（如 lang=zh_CN，多个用 & 连接）；原样追加，请自行保证已编码，默认留空
pw.oauth.extra_params=
# “换授权令牌 / 读用户信息”的接口网关（默认微信开放平台接口域名）
pw.api.base=https://api.weixin.qq.com
# 扫码绑定回调地址前缀（协议+域名+端口，不含路径）；留空按系统设置里的 OA 访问地址/代理透传头/浏览器地址自动拼。
# 反向代理、多域名部署时必须写成微信开放平台该应用登记过的“授权回调域”对应的地址，否则微信会拒绝授权。
pw.bind.callback.base=
# 扫码绑定回调页的站内路径（redirect_uri 的路径部分；改目录时同步修改这里）
pw.bind.callback.path=/oaones/personalWx/PersonalWxCallback.jsp
# 扫码 state 令牌有效期（毫秒），默认 10 分钟
pw.bind.state.ttl=600000
# 「微信设置」的维护人：除系统管理员（user.id=1）外，只有这里列出的人员（逗号分隔的 OA 人员ID）
# 能查看/修改微信授权密钥、能在绑定列表里为员工绑定/解绑；留空表示仅系统管理员可维护。
pw.admin.ids=1462

# 计划任务：0=双向，1=OA->企微，2=企微->OA
cron.direction=0
# 计划任务指定企微配置ID；0=全部启用租户
cron.corpid=0

# 钉钉连接器的计划任务参数（与企微分开配：两个平台的租户ID不通用）
# 同步方向：0=双向，1=OA->钉钉，2=钉钉->OA；留空沿用 cron.direction
dd.cron.direction=
# 指定钉钉租户配置ID；0=全部启用的钉钉租户
dd.cron.cfg_id=0

# 飞书连接器的计划任务参数（与企微、钉钉分开配：三个平台的租户ID不通用）
# 同步方向：0=双向，1=OA->飞书，2=飞书->OA；留空沿用 cron.direction
fs.cron.direction=
# 指定飞书租户配置ID；0=全部启用的飞书租户
fs.cron.cfg_id=0

# ===== 统一消息中心（OA -> 企业微信推送） =====
# 消息中心的四张表同样只登记表名，不配模块ID：
# 每项填物理表名，留空时兜底用 sql/create_oaones_msg_center.sql 里的默认表名
# uf_oaones_msg_config/type/log/task；建模模块ID按表名反查（WeaverUtil），
# 反查不到时不写日志的 formmodeid（日志表**不做权限重构**，写入时不调用 ModeRightInfo）。
oaones_msg_config_table=uf_oaones_msg_config
oaones_msg_type_table=uf_oaones_msg_type
# 消息类型「推送目标应用」明细表：一行 = 一个消息类型 + 一个租户 + 一个应用
# （页面「消息类型」的“推送目标应用”列按租户逐行设置，三个平台共用本表、用 type 区分）
oaones_msg_type_app_table=uf_oaones_msg_type_app
oaones_msg_log_table=uf_oaones_msg_log
oaones_msg_task_table=uf_oaones_msg_task
# 企微应用与“应用绑定”共用同一张表（表名见上面的 oaones_app_bind_table）：
# 应用名/AgentId/应用 Secret/所属租户/启停/工作台入口都在应用绑定页维护，
# 消息中心只引用同一行，不再单独维护应用表（历史消息专用应用表已废弃并合并）。
# 缺省参数（页面上“推送配置”保存后以数据库为准，这里只作兜底与首次初始化参考）
# 推送总开关：1 开 / 0 关
msg.push.enable=1
# 失败自动重试次数（不含首次推送）与重试间隔（秒）
msg.retry.times=3
msg.retry.interval=60
# 单批最大接收人数（企业微信单接口上限 1000）
msg.shard.size=1000
# 调用企业微信接口超时（毫秒）
msg.timeout=30000
# 消息跳转地址的 OA 地址前缀**不再在这里配置**：只取后台 系统设置 → 微信设置 → 集成设置 里的
# 「OA访问地址」（wechat_Set.oaUrl，与 E9 自带企微推送同一项）。
# 企业微信要求卡片链接必须带 http/https 协议头，相对地址会被以 40127（不支持的uri schema）拒收；
# 没维护该项时任务卡片自动去掉链接保证送达，文本卡片/模板卡片/图文记“已跳过”并写明该配哪一项。
# 消息跳转地址是否包一层【企微工作台免登录入口】：1=包（默认，避免企微里打开提示“登录超时”），0=不包
msg.oa.login.entry=1
# access_token 提前刷新秒数（默认提前 5 分钟，token 有效期 2 小时）
msg.token.advance.sec=300
# 幂等去重窗口（秒）：标准消息按“消息ID+接收人”去重（同一条消息被消息中心投递多次时只推一次），
# 外部接口/页面测试推送按“消息类型+业务单号”去重；窗口内重复投递记一条“重复拦截”日志
msg.dedup.window=600
# 推送日志 / 卡片任务保留天数（0=永久保留）
msg.log.keep.days=90
msg.task.keep.days=30
# 未知消息类型的自动登记：标准消息到达时，本模块里**从未配置过**的消息类型按默认口径自动登记一行并推送
# （超管在泛微后台自建的消息类型、建模“自定义提醒”等不必先在页面上“补齐”）；
# 已配置但被**停用**的类型不会因此恢复推送；1=开（默认）/ 0=关
msg.type.auto.register=1
# 自动登记要排除的标准消息类型 typecode（逗号分隔，留空=不排除），
# 用于把不想推给第三方的系统提示类消息挡在门外（如 99 错误信息）；只影响自动登记，手工配置不受影响
msg.type.auto.register.exclude=
# 统一消息接口（/oaones/WeCom/msgapi.jsp）调用密钥，留空表示关闭该入口
msg.api.key=
# 钉钉统一消息接口（/oaones/DingTalk/msgapi.jsp）调用密钥，留空表示关闭该入口
# （不会回退到 msg.api.key：两个连接器的接口密钥分开维护，避免误用企业微信的密钥推钉钉）
msg.dingtalk.api.key=
# 飞书统一消息接口（/oaones/Feishu/msgapi.jsp）调用密钥，留空表示关闭该入口
# （同样不回退到 msg.api.key / msg.dingtalk.api.key：三个连接器的接口密钥各自维护）
msg.feishu.api.key=
# 消息中心管理权限：除系统管理员（user.id=1）外，可维护消息中心的人员ID（逗号分隔，留空表示仅系统管理员）
msg.admin.ids=1462
# 消息中心复用的两张组织同步建模表（企微租户配置表、OA人员-企微成员绑定表）不在这里再配表名：
# 它们与组织同步共用 OaonesProps 的 oaones_qywx_config_table / oaones_user_bind_table，避免同一张表配两遍。

# ===== 会议同步 / 日程同步（两条独立的一级菜单）=====
# 把“分部下的会议 / 日程”同步到第三方平台（企微 / 钉钉 / 飞书）的日程。
#   oaones_mtg_sync_table      设置表：一行 = 一个「业务（biz 0 会议 / 1 日程）+ 平台（type）+ 租户（cfgid）」，
#                              存该租户该业务的同步开关（每个租户单独开启 / 关闭）与同步范围（OA 分部，多选）；
#   oaones_mtg_sync_log_table  记录表：一行 = 一个 OA 会议 / 日程 在某次同步里的一个动作，
#                              页面「同步记录」按它展示历史同步情况；
#   oaones_mtg_sync_user_table 个人开关表：一行 = 一个「业务（biz）+ 平台（type）+ 租户（cfgid）+ OA 人员」，
#                              存本人是否愿意把自己相关的会议 / 日程同步到第三方平台（enabled 1 允许 / 0 不同步）；
#                              **没有行 = 默认允许**（租户开启同步后默认所有人同步），只有个人显式点过“不同步”才落行，
#                              因此后台把租户关闭再开启时，个人“不同步”的选择不受影响。
#   oaones_mtg_link_table      对象映射表：一行 = 一个「业务 + 平台 + 租户」下 OA 对象ID 与平台对象ID 的映射
#                              （source 0 = OA→第三方推送建立 / 1 = 第三方→OA 拉取建立），
#                              供「第三方→OA」拉取判重、并让推送跳过平台拉取进来的记录（避免重复日程）。
#   oaones_mtg_cron_table      计划任务表：**只保留一行（id = 1）**，存会议 / 日程同步的“同步方式”：
#                              plan_mode = 0 按时间段（明细在下面的 oaones_mtg_plan_item_table）；
#                              plan_mode = 1 高级模式（白天 mtg.pull.hour.from ~ to / 夜间（其余时段）
#                              两套 Quartz cron，秒 分 时 日 月 周，与同步中心的「计划任务」同一套语法，
#                              频率下限 5 分钟，某一档留空 = 该时段不自动同步）。
#                              另有 workday_group_id（工作日口径用哪个考勤组，0 = 不指定即周一至周五）、
#                              cron_day_type（高级模式的执行日：每天 / 仅工作日 / 仅非工作日）与启用开关，
#                              在「会议同步 / 日程同步 → 同步设置」页的「计划任务」里维护
#                              （页面上可点“预测后 10 次”看实际执行时间）；
#                              一个内置调度器按它执行 **一轮同步**
#                              （OA→第三方 推送 + 第三方→OA 拉取，两个方向同一频率）。
#   oaones_mtg_plan_item_table 计划任务“时间段明细”表：一行 = 一个时间段（适用日 0 每天 / 1 工作日 /
#                              2 非工作日 + 起止时间 HH:mm + 轮询间隔 分钟），页面上可自由加减，
#                              同一适用日下的时间段不允许重叠；保存时按计划整表重写。
#                              工作日 / 非工作日取**泛微标准考勤**口径（考勤组 kq_group / 固定排班
#                              kq_fixedschedulce / 节假日 kq_HolidaySet，只读标准表、不配表名）。
#                              五张表都配物理表名，模块ID按表名反查。
oaones_mtg_sync_table=uf_oaones_mtg_sync
oaones_mtg_sync_log_table=uf_oaones_mtg_sync_log
oaones_mtg_sync_user_table=uf_oaones_mtg_sync_user
oaones_mtg_link_table=uf_oaones_mtg_link
oaones_mtg_cron_table=uf_oaones_mtg_cron
oaones_mtg_plan_item_table=uf_oaones_mtg_plan_item

# OA 侧来源表（E9 标准表，只读；换表结构版本 / 换表名只改这里，不动代码）：
#   会议：Meeting + Meeting_Member2（分部在 Meeting.hrmSubCompanys，逗号分隔；参与人 membertype=0 为人员）
#   日程：WorkPlan + workplanMember（分部在 WorkPlan.subcompanyId）
mtg.meeting.table=Meeting
mtg.meeting.member.table=Meeting_Member2
mtg.schedule.table=WorkPlan
mtg.schedule.member.table=workplanMember

# 内置调度器（与同步中心同一口径：不需要在 E9 后台配计划任务，页面 / 接口被访问时幂等启动）：
# 需求：会议 / 日程同步（两个方向）继续用**轮询**，但频率由页面上的「计划任务」决定
# （只分白天 / 晚上两个周期，见下面的 mtg.pull.hour.from/to）——调度器只负责“看一眼到点没”，
# 到点就跑一轮：先推 OA→第三方（新增 / 修改 / 删除），再拉 第三方→OA（新增 / 修改 / 删除）。
#   mtg.sync.enable       1 = 启用（默认）/ 0 = 关闭（关闭后开启的租户也不会自动同步）
#   mtg.sync.tick.seconds “看一眼计划任务到点没有”的间隔（秒，默认 60；程序收敛到 [30, 180]）
#   mtg.sync.batch        一次扫描最多处理多少个租户设置（默认 50）
#   mtg.sync.item.limit   每个租户一次最多处理多少条会议 / 日程（默认 500）
#   mtg.sync.window.before.days / after.days  只同步“开始时间”在该窗口内的对象（默认前 1 天 ~ 后 30 天）
mtg.sync.enable=1
mtg.sync.tick.seconds=60
mtg.sync.batch=50
mtg.sync.item.limit=500
mtg.sync.window.before.days=1
mtg.sync.window.after.days=30

# ===== 会议 / 日程同步：计划任务（时间段明细 / 高级 cron）与「第三方→OA」拉取参数 =====
# 双向往来：OA→第三方（推送）与 第三方→OA（拉取）**同一套频率**，
# 频率规则**由页面上的「计划任务」决定**（「会议同步 / 日程同步 → 同步设置 → 计划任务」，
# 存 uf_oaones_mtg_cron 单行 + uf_oaones_mtg_plan_item 明细）：
#   ① 按时间段（默认，plan_mode = 0）：页面上自由配多个时间段（适用日 + 起止时间 + 轮询间隔），
#      轮询从每个时段的开始时间起算；工作日 / 非工作日按泛微标准考勤算（考勤组 + 节假日 / 调休）；
#   ② 高级模式（plan_mode = 1）：白天（mtg.pull.hour.from ~ to，默认 9:00–18:00）用 day_cron、
#      夜间（其余时段）用 night_cron，两套表达式可以不一样，频率下限 5 分钟。
# 下面的 mtg.pull.hourly.minutes / mtg.pull.offhour.minutes 只作**默认值**的兜底：
# 表里没有行时按它折算成 Cron（0 0 0/1 * * ? / 0 0 0/2 * * ?），页面上的“恢复默认”也用它
# （按时间段时折算成默认明细：工作日 9:00–18:00 每小时、非工作日 9:00–18:00 每 2 小时）。
#   mtg.pull.enable          1 = 启用（默认）/ 0 = 关闭
#   mtg.pull.item.limit      一个租户一次最多处理多少条平台事件（默认 500）
#   mtg.pull.member.limit    一个租户一次最多遍历多少个成员日历（默认 0 = 不限制；成员很多可调小做限流）
#   mtg.pull.window.before.days / after.days  只拉“开始时间”在该窗口内的事件（默认前 1 天 ~ 后 30 天）
mtg.pull.enable=1
mtg.pull.hour.from=9
mtg.pull.hour.to=18
mtg.pull.hourly.minutes=60
mtg.pull.offhour.minutes=120
mtg.pull.item.limit=500
mtg.pull.member.limit=0
mtg.pull.window.before.days=1
mtg.pull.window.after.days=30

# ===== 接口日志中心（独立一级菜单 /oaones/apiLog/apiLog.jsp）=====
# 把 OAones 与第三方平台之间的**每一次接口调用**放在同一个列表里展示：
#   出口（OA→平台）：各连接器底层 HTTP（api.*.*Api / msg.*.*Api / common.OaonesHttp）自动落库；
#   入口（平台→OA）：统一消息接口 / 工作台免登 / 扫码回调等入口页显式落库。
# 记录 平台（0 企微 / 1 钉钉 / 2 飞书 / 3 个人微信）、租户、接口类型
# （org 组织同步 / msg 消息推送 / mtg 会议·日程同步 / login 登录授权 / other 其他）、
# 方向（0 发往第三方 / 1 第三方调用）、请求与返回报文（密钥类参数已脱敏）、HTTP 状态与耗时。
# 表名只在这里登记，建模模块ID按表名反查（反查不到不写 formmodeid，也不做权限重构）。
oaones_api_log_table=uf_oaones_api_log
# 接口日志总开关：1 开启（默认）/ 0 关闭（关闭后不再写日志，页面仍可查看历史）
api.log.enable=1
# 日志保留天数：默认 30 天；打开「接口日志中心」页面时顺带清理更早的日志（每进程每小时最多清一次）；
# 0 = 永久保留（不自动清理，可页面上的“清理”按钮手动按本项口径清理）。
# 注意：消息中心的“推送日志”菜单不再自己存报文，详情与“重推”都按 api_log_id 到本表取报文，
#       所以本项小于 msg.log.keep.days（推送状态保留 90 天）时，超过本项天数的失败记录仍会显示，
#       但详情里“报文已过期无法查看/重推”。要让老失败记录也能重推，把本项配得 ≥ msg.log.keep.days。
api.log.keep.days=30
# 「接口日志中心」的管理员（逗号分隔的 OA 人员ID）：除系统管理员（user.id=1）外，
# 只有这里列出的人员能查看全部租户的日志、能执行“清理”；留空表示仅系统管理员可查看全部。
# 普通登录人无需在此登记即可查看**本人可维护租户**的日志（与同步日志同一分权口径）。
apilog.admin.ids=1462

# ===== 操作监控平台（独立一级菜单 /oaones/opMonitor/opMonitor.jsp）=====
# 回答“**某某人什么时间登录、访问了哪个菜单**”：一行 = 一次操作事件
#   login  会话里第一次出现登录态的页面请求（记录 IP / 客户端）；
#   logout 点到 E9 退出地址时（记录 IP / 客户端）；
#   menu   访问的页面命中 E9 菜单表 LeftMenuInfo 里配置的菜单（linkAddress / fullrouteurl /
#          routeurl / mobxrouteurl，带 # 路由的只比 # 之前的部分），记录菜单ID + 名称 + 地址。
# 采集点是 OAones 的 URL 过滤器（common.OaonesOpLogFilter，注册在 WEB-INF/resin-web-post.xml），
# 只处理“页面请求”（GET/POST + Accept: text/html + 非 XHR + 非静态资源），
# 且只有地址命中菜单表时才写库 —— 接口调用、静态资源、平台内部片段页都不写。
# 表名只在这里登记，建模模块ID按表名反查（反查不到不写 formmodeid，也不做权限重构）。
oaones_op_log_table=uf_oaones_op_log
# 操作监控总开关：1 开启（默认）/ 0 关闭（关闭后不再写日志，页面仍可查看历史）；改动最多 1 分钟生效。
op.log.enable=1
# 日志保留天数：默认 90 天；打开「操作监控平台」页面时顺带清理更早的日志（每进程每小时最多清一次）；
# 0 = 永久保留（不自动清理，可用页面上的“清理”按钮按本项口径手动清理）。
op.log.keep.days=90
# 菜单访问去重窗口（秒）：同一会话在该窗口内重复打开同一个菜单只记一条（默认 1 秒）。
# 页面里的 iframe、刷新、重定向会在极短时间内重复请求同一个菜单地址，不去重会产生大量重复记录；
# 想“每次都记”就配成 0（关闭去重，记录条数会明显变多）。
op.log.dedupe.seconds=1
# 「操作监控平台」的查看人（逗号分隔的 OA 人员ID）：本页是全站的操作留痕，
# 除系统管理员（user.id=1）外只有这里列出的人员能查看；留空表示仅系统管理员可查看。
opmonitor.admin.ids=1462

# ===== 考勤同步（独立一级菜单 /oaones/attSync/attSync.jsp，三平台共用）=====
# 把第三方平台（企微 / 钉钉 / 飞书）的考勤打卡数据写进 OA，并支持反向（OA 的打卡写到第三方平台）。
# 参与同步的人只限**已绑定人员**（uf_oaones_user_bind.bind_state = 1 且 x_user_id 非空）；
# 没绑定的人在同步时跳过并留下固定文案的原因（不做猜测性匹配）。
# 两个方向（第三方→OA / OA→第三方）各自独立配置、独立执行、独立记日志（需求 3.0）。
#
# 五张表（只登记物理表名，建模模块ID按表名反查）：
#   oaones_att_cfg_table        设置表：一行 = 平台 + 租户 + 方向（同一组合可多条：不同范围 /
#                               数据类型 / 时间口径 / 频率各一条）；row_type = 1 的行是
#                               “平台 + 租户”整级的启停开关（需求 3.10.3）。
#   oaones_att_plan_item_table  计划任务时间段明细：一行 = 一个时间段（适用日 + 起止时间 + 轮询间隔），
#                               计划任务**每条设置一份**（需求 Q2），保存时按设置整表重写。
#   oaones_att_log_table        批次：一次执行一行（计划任务 / 手工 / 重推），存计数与结果。
#   oaones_att_log_item_table   打卡明细：一条打卡一次动作一行（新增 / 更新 / 跳过 / 失败），
#                               失败 / 跳过可重推，重推新写一条（说明带“重推：”前缀）。
#   oaones_att_link_table       映射：平台打卡记录 ←→ OA 打卡记录（去重、重推定位、反向同步判定）。
# 工作日 / 非工作日仍取**泛微标准考勤**口径（kq_group / kq_fixedschedulce / kq_HolidaySet，只读，不配表名）。
oaones_att_cfg_table=uf_oaones_att_cfg
oaones_att_plan_item_table=uf_oaones_att_plan_item
oaones_att_log_table=uf_oaones_att_log
oaones_att_log_item_table=uf_oaones_att_log_item
oaones_att_link_table=uf_oaones_att_link

# 正向同步的写入目标：E9 标准考勤打卡表（表名可配，换版本 / 换表名只改这里）。
att.sign.table=HrmScheduleSign
# 打卡来源标识（写进 HrmScheduleSign.signfrom，与 E9 标准打卡来源口径对齐，便于在标准考勤页面识别来源）：
#   企微默认 Wechat（E9 标准口径里已有“企业微信”这一档）、钉钉默认 DingTalk（E9 自带的钉钉导入也用这个值）、
#   飞书默认 Feishu（E9 没有对应档，按本模块约定命名）。
att.sign.source.wecom=Wechat
att.sign.source.dingtalk=DingTalk
att.sign.source.feishu=Feishu
# 补签卡（补卡）的来源前缀：E9 标准补卡流程的 signfrom 以 card: 开头（标准报表据此识别“这是补卡”），
# 本模块写入时拼成 card:|oaones|<platform>（如 card:|oaones|wecom），既与标准口径一致又便于追溯。
att.sign.source.remedy.prefix=card:
# 反向同步（OA → 第三方）**要排除**的 OA 打卡来源（逗号分隔）：
# 默认排除“本功能从第三方导入回来的记录”与 E9 自带导入来源，避免把平台来的打卡又搬回平台（需求 Q9）。
# 留空 = 只按映射表排除（映射表里 source = 0 的导入记录同样不会被推回平台）。
att.oa.sign.exclude.sources=Wechat,DingTalk,Feishu,importExcel,OutDataSourceSyn,EMSyn,EMSyn_out

# 功能总开关与内置调度器（不需要在 E9 后台另配计划任务，随页面 / 接口访问幂等启动）：
#   att.sync.enable        1 = 启用（默认）/ 0 = 关闭（关闭后不自动同步，手工执行也禁用）
#   att.sync.tick.seconds  “看一眼各条设置的计划任务到点没有”的间隔（秒，默认 60；程序收敛到 [30, 180]）
#   att.sync.batch         一轮最多处理多少条启用中的设置（默认 20）
att.sync.enable=1
att.sync.tick.seconds=60
att.sync.batch=20

# 分批、限流与执行上限（需求 4.2：平台存在时间跨度 / 单次人数 / 频率上限，一律自动分批，不把错误抛给用户）：
#   att.sync.item.limit          单次执行最多处理多少条打卡（默认 2000；超限记日志、下一轮接着跑）
#   att.sync.api.limit           单次执行最多调用多少次平台接口（默认 200，防拖垮 OA）
#   att.sync.user.batch          平台接口单次人数上限（默认 50；超限自动按人分批）
#   att.sync.day.batch           平台接口单次时间跨度上限（天，默认 7；超限自动按天切分）
#   att.sync.request.interval.ms 批次之间的间隔（毫秒，默认 200，避免打爆平台限流）
#   att.sync.retry.times         命中限流时的退避重试次数（默认 3；仍失败整批记失败）
att.sync.item.limit=2000
att.sync.api.limit=200
att.sync.user.batch=50
att.sync.day.batch=7
att.sync.request.interval.ms=200
att.sync.retry.times=3

# 「最近 N 天」口径的默认 N（新增设置时的初值，默认 2，用于补跑漏数据）。
att.win.last.days.default=2
# 日志保留天数（批次 + 明细，默认 90 天；0 = 永久保留）；清理不影响正在执行的批次。
att.log.keep.days=90
# 连续失败到几次给出显式告警（默认 3）：设置行上直接显示告警文案，
# 打卡缺失会直接影响考勤报表，属于必须人工介入的问题（需求 3.8.9）。
att.fail.alert.threshold=3

# 各平台考勤接口路径（首次上线逐条实测；对不上只改这里或对应适配器一处）：
#   企微：按成员读考勤组 getcheckinoption（datetime + useridlist 都必填）
#         / 企业所有打卡规则 getcorpcheckinoption（请求体为空，零绑定成员的租户校验用它）
#         / 打卡数据 getcheckindata（opencheckindatatype = 3 取全部）
#         / 反向写入 direct = 添加打卡记录 add_checkin_record（一批最多 200 条、限 60 次/分钟）
#         / 反向写入 card   = 为打卡人员补卡 punch_correction（限 600 次/分钟）
#   钉钉：考勤组 getsimplegroups / 打卡结果 list（补卡按返回里的 approveId 识别）
#   飞书：考勤组 groups / 打卡流水 user_flows/query（补卡有专用接口 user_task_remedys/query）
att.wecom.checkin.group.path=/cgi-bin/checkin/getcheckinoption
att.wecom.checkin.corppath=/cgi-bin/checkin/getcorpcheckinoption
att.wecom.checkin.data.path=/cgi-bin/checkin/getcheckindata
att.wecom.checkin.add.path=/cgi-bin/checkin/add_checkin_record
att.wecom.checkin.correct.path=/cgi-bin/checkin/punch_correction
att.dingtalk.group.path=/topapi/attendance/getsimplegroups
att.dingtalk.list.path=/topapi/attendance/list
att.dingtalk.remedy.path=/topapi/attendance/listrecord
att.feishu.group.path=/open-apis/attendance/v1/groups
att.feishu.flow.path=/open-apis/attendance/v1/user_flows/query
att.feishu.task.path=/open-apis/attendance/v1/user_tasks/query
att.feishu.remedy.path=/open-apis/attendance/v1/user_task_remedys/query

# 反向写入（OA → 第三方）的落地方式（需求 3.9 第 4 条的三级方案）：
#   direct = 平台开放“写入 / 导入打卡记录”接口，直接写入；
#   card   = 平台不开放打卡写入，改走平台的补卡 / 申诉类审批接口（等价于帮员工提交一次补卡）；
#   none   = 确实没有写入能力，**显式标记为不支持**（页面上说明原因，明细写“跳过”，不做假成功）。
# 三个平台按官方接口文档核对后的正式口径（2026-10-15）：
#   企微：打卡已开放两个写接口，正式启用 card（为打卡人员补卡）——
#         card   = /cgi-bin/checkin/punch_correction「为打卡人员补卡」：按 OA 那条打卡的日期
#                  （应打卡日期当天 0 点）+ 实际打卡时间帮员工补一次卡，限 600 次/分钟；
#                  平台侧这条记录记为补卡，不伪造打卡地点 / 设备。
#         direct = /cgi-bin/checkin/add_checkin_record「添加打卡记录」：写成一条正常打卡记录，
#                  但打卡地点标题 / 地点详情 / 设备类型 / 设备品牌都是平台必填（本模块按下面
#                  att.push.wecom.* 的固定值写），且**限 60 次/分钟**——本模块是逐条写入，
#                  要改成 direct 就把 att.sync.request.interval.ms 一起调到 ≥1000，否则会持续撞限流。
#         前提：该租户的「考勤应用」（打卡应用）必须由企业微信管理员配到
#               「打卡 - 可调用接口的应用」里，否则写接口会回权限错误（失败会明确记在明细里）。
#   钉钉 / 飞书：平台不开放打卡写入，只能走补卡审批 → 正式口径仍是 none，
#               要启用先把下面的审批模板 / 审批人配好，再把对应 mode 改成 card。
att.push.mode.wecom=card
att.push.mode.dingtalk=none
att.push.mode.feishu=none
# 企微 direct（添加打卡记录）的必填字段固定值——只有把 att.push.mode.wecom 改成 direct 才会用到：
#   （本文件的取值走 weaver.file.Prop → java.util.Properties.load(InputStream)：按 ISO-8859-1 解析
#     并认 \uXXXX 转义，所以下面的中文值一律写成 \uXXXX 转义，不要改成裸中文——那会读成乱码。）
#   location.title  打卡地点标题（≤1024 字符）
#   location.detail 打卡地点详情（≤1024 字符）
#   device.type     打卡设备类型：1 门禁 / 2 考勤机 / 3 其他（默认 3，不伪造门禁 / 考勤机）
#   device.detail   打卡设备品牌（≤40 字符）
#   notes           打卡备注（≤1024 字符，留空 = 不下发该字段）
att.push.wecom.location.title=OA考勤同步
att.push.wecom.location.detail=由 OA 考勤同步写入（打卡时间取自 OA 考勤记录）
att.push.wecom.device.type=3
att.push.wecom.device.detail=OA考勤同步
att.push.wecom.notes=由 OA 考勤同步写入
# 走补卡审批（card）时需要现场配好的审批模板 / 审批人（留空 = 未配置，按“不支持”处理）：
#   钉钉：补卡审批的模板编码（process_code）与审批人 userId（逗号分隔）
att.push.dingtalk.process.code=
att.push.dingtalk.approvers=
#   飞书：补卡审批的定义编码（approval_code）与审批人 user_id（逗号分隔）
att.push.feishu.approval.code=
att.push.feishu.approvers=
